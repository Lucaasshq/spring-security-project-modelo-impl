# Conexao com o Postgres Local
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Debug e Hibernate para Produção
spring.jpa.hibernate.ddl-auto=none

# JWT config para Produção
jwt.secret=${JWT_SECRET}
jwt.expire-days=${JWT_EXPIRE_DAYS}
jwt.expire-hours=${JWT_EXPIRE_HOURS}
jwt.expire-minutes=${JWT_EXPIRE_MINUTES}
jwt.expiration-refresh-days=${JWT_EXPIRATION_REFRESH_DAYS}