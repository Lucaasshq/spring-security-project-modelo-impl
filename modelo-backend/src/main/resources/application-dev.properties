# Conexao com o Postgres Local
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chegaai}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}



# Debug e Hibernate para Desenvolvimento
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=create

# JWT config para Desenvolvimento
jwt.secret=${JWT_SECRET:sua-chave-secreta-jwt-muito-segura-e-longa-para-desenvolvimento}
jwt.expire-days=${JWT_EXPIRE_DAYS:7}
jwt.expire-hours=${JWT_EXPIRE_HOURS:0}
jwt.expire-minutes=${JWT_EXPIRE_MINUTES:0}
jwt.expiration-refresh-days=${JWT_EXPIRATION_REFRESH_DAYS:1}